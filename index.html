<head>
<meta charset="UTF-8">

<title>WhatsApp Manager</title>

<style>
* {

    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;

.login-box {
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 22px;
    padding: 38px;
    box-shadow: 0 25px 70px rgba(0,0,0,.3);

}

.logo {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #25d366;

    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 32px;
    font-weight: bold;
}

.login-box h1 {
    font-size: 27px;
    margin-bottom: 8px;
}

.login-box p {
    color: #667781;
    margin-bottom: 25px;
}

input {
    width: 100%;
    border: 1px solid #d7dde2;
    border-radius: 12px;
    padding: 15px;
    font-size: 16px;
    outline: none;
    margin-bottom: 12px;
}

input:focus {
    border-color: #25d366;
}

button {
    border: 0;
    cursor: pointer;
    border-radius: 10px;
    padding: 12px 18px;
    font-weight: 700;
    font-size: 14px;

button:hover {
    transform: translateY(-1px);

    color: white;
    padding: 15px;

.login-btn:hover {

.error {
    color: #d93025;
    font-size: 14px;
    margin-top: 12px;
    display: none;
}

}
